name: Oracle Free Instance Hunter

on:
  workflow_dispatch: # Permite arrancar de forma manual
  schedule:
    - cron: '*/30 * * * *' # Bucle de reintento automático cada 30 minutos

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install oci
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generar archivo config oficial de Oracle
        run: |
          cat <<EOF > config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=id_rsa.pub
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Generar archivo de clave privada temporal
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > id_rsa.pub
          chmod 600 id_rsa.pub

      - name: Inyectar datos de Madrid 3 en el código fuente
        run: |
          # 1. Forzar el Compartimento correcto del usuario sobre la Tenancy raíz
          sed -i 's/compartment_id = config\["tenancy"\]/compartment_id = "${{ secrets.OCI_COMPARTMENT_OCID }}"/g' main.py
          
          # 2. Reemplazar la Subred hardcodeada por tu secreto de subred de Madrid 3
          sed -i 's|SUBNET_ID = "ocid1.subnet.oc1.eu-frankfurt-1.xxxx"|SUBNET_ID = "${{ secrets.OCI_SUBNET_OCID }}"|g' main.py
          
          # 3. Reemplazar la Imagen por la de Ubuntu 24.04 ARM nativa para eu-madrid-3
          sed -i 's|IMAGE_ID = "ocid1.image.oc1.eu-frankfurt-1.xxxx"|IMAGE_ID = "ocid1.image.oc1.eu-madrid-3.aaaaaaaayw6w7h3qom2vctsm7bzwumndwun2eclixshmptf2h3c6g66bcoofm76a"|g' main.py
          
          # 4. Ajustar los recursos a tus 2 OCPUs y 12 GB de RAM elegidos
          sed -i 's/FINAL_OCPUS = 1.0/FINAL_OCPUS = 2.0/g' main.py
          sed -i 's/FINAL_MEMORY = 6.0/FINAL_MEMORY = 12.0/g' main.py

      - name: Ejecutar script cazador
        run: |
          python main.py --config-path config --private-key-path id_rsa.pub
