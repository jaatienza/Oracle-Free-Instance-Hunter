name: Oracle Free Instance Hunter

on:
  workflow_dispatch: 
  schedule:
    - cron: '*/30 * * * *' 

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install oci
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generar archivo config oficial de Oracle
        run: |
          cat <<EOF > config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=api_private_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Generar archivo de clave privada de la API
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > api_private_key.pem
          chmod 600 api_private_key.pem

      - name: Generar archivo de clave publica SSH para el Servidor
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > id_rsa.pub

      - name: Forzar datos de Madrid 3 en las tripas de main.py
        run: |
          # 1. Cambiamos las dos líneas de configuración del inicio de main.py por tus datos de Madrid 3 reales
          sed -i 's|SUBNET_ID = "ocid1.subnet.oc1.eu-frankfurt-1.xxxx"|SUBNET_ID = "${{ secrets.OCI_SUBNET_OCID }}"|g' main.py
          sed -i 's|IMAGE_ID = "ocid1.image.oc1.eu-frankfurt-1.xxxx"|IMAGE_ID = "ocid1.image.oc1.eu-madrid-3.aaaaaaaayw6w7h3qom2vctsm7bzwumndwun2eclixshmptf2h3c6g66bcoofm76a"|g' main.py
          
          # 2. Forzamos el compartimento del usuario en la lectura
          sed -i 's/compartment_id = config\["tenancy"\]/compartment_id = "${{ secrets.OCI_COMPARTMENT_OCID }}"/g' main.py
          
          # 3. Ajustamos los límites de la máquina en el código
          sed -i 's/FINAL_OCPUS = 1.0/FINAL_OCPUS = 2.0/g' main.py
          sed -i 's/FINAL_MEMORY = 6.0/FINAL_MEMORY = 12.0/g' main.py

      - name: Ejecutar script cazador
        run: |
          python main.py --config-path config --private-key-path id_rsa.pub
