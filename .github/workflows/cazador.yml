name: Oracle Free Instance Hunter

on:
  workflow_dispatch: # Te permite darle al botón "Run workflow" a mano
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta automáticamente cada 30 minutos

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install oci
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generar archivo config oficial de Oracle
        run: |
          cat <<EOF > config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=id_rsa.pub
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Generar archivo de clave privada temporal
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > id_rsa.pub
          chmod 600 id_rsa.pub

      - name: Ejecutar script cazador con variables inyectadas
        env:
          # Inyectamos los datos de la máquina como variables de entorno para el script de Python
          OCI_OCPUS: 2
          OCI_MEMORY_IN_GBS: 12
          OCI_IMAGE_ID: ocid1.image.oc1.eu-madrid-1.aaaaaaaamyw57x3m6m7bcywsmwmdwun2eclixshmptf2h3c6g66bcoofm76a
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          python main.py --config-path config --private-key-path id_rsa.pub
